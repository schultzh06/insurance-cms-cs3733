    <rect x="610" y="190" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="675" y="216">EXL</text><text x="675" y="234">Operations</text>
    <rect x="760" y="190" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="825" y="216">Business</text><text x="825" y="234">Operations</text>
