    <rect x="160" y="190" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="225" y="216">Business</text><text x="225" y="234">Analysis</text>
    <rect x="385" y="190" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
